services:
  web:
    build: .
    entrypoint: ["uvicorn", "app.fast_api_app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
      - "3000:8080"
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_LOCATION=global
      - GOOGLE_GENAI_USE_VERTEXAI=true

  app:
    build: .
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_LOCATION=global
      - GOOGLE_GENAI_USE_VERTEXAI=true

  test:
    build: .
    entrypoint: pytest
    volumes:
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_LOCATION=global
      - GOOGLE_GENAI_USE_VERTEXAI=true
