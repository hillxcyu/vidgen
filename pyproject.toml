[project]
name = "vidgen-omni"
version = "0.1.0"
description = "Multi-Agent Generative Media Pipeline (GenMedia-Omni)"
authors = [
    {name = "vidgen-team", email = "xcyu@google.com"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.10.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-genai>=0.1.0",
    "google-cloud-storage>=2.10.0",
    "pydantic>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests/unit", "tests/integration"]
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

