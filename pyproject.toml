[project]
name = "vidgen-omni"
version = "0.1.0"
description = "Multi-Agent Generative Media Pipeline (GenMedia-Omni)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=0.1.0",
    "google-cloud-storage>=2.10.0",
    "pydantic>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
